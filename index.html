<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes safe-area insets (notches) via CSS env() — see ADR-007 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- The splash cover's backdrop (src/marche/ui/splash-boot.ts): no flash at launch. -->
    <meta name="theme-color" content="#120e14" />
    <!-- The Kyridril icon (brand/kyridril-icon.png), served from public/ — relative: the site lives under a sub-path. -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!--
      The installable version (docs/marche/architecture.md §13 « Version installable (PWA) »): the
      manifest (relative: id, start_url and scope are the folder), iOS's home-screen app full
      screen under a translucent status bar (the safe-area insets keep the UI clear of it).
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Erynd Var" />
    <title>Kyridril - Erynd Var</title>
    <style>
      :root {
        /* Safe-area insets, readable from JS via getComputedStyle (see core/safe-area.ts) */
        --sai-top: env(safe-area-inset-top, 0px);
        --sai-right: env(safe-area-inset-right, 0px);
        --sai-bottom: env(safe-area-inset-bottom, 0px);
        --sai-left: env(safe-area-inset-left, 0px);
        /* The screen the game's frame fills (#marche-frame below): the viewport in a tab. */
        --scr-w: 100vw;
        --scr-h: 100dvh;
        /* The buttons' face (its @font-face below; src/marche/ui/css.ts .marche-button). */
        --font-btn: 'Erynd Bouton', Georgia, serif;
      }

      /*
       * The installed app (home screen): the frame fills the page itself (the body, a size
       * container), never the viewport units — iOS's home-screen app keeps them stale after
       * the OS turns it (launched upright, then turned: a band of the old size left dark on
       * one edge). No toolbar there, so the page is the whole screen.
       */
      @media (display-mode: standalone), (display-mode: fullscreen) {
        :root {
          --scr-w: 100cqw;
          --scr-h: 100cqh;
        }

        html[data-mode] body {
          container-type: size;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        /* Disable browser touch gestures that interfere with game input */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      #game-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Pixel-art (legacy Valemont / sandbox): never smooth the upscaled canvas */
      #game-root canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* La Marche d'Erynd: smooth cartoon art, scaled with filtering */
      html[data-mode='marche'] #game-root canvas,
      html[data-mode='gallery'] #game-root canvas,
      html[data-mode='ui'] #game-root canvas {
        image-rendering: auto;
      }

      /*
       * Before the script picks the mode: black, as the launch screens around it (the native
       * apps', the installed app's) and the studio screen that follows (src/marche/ui/studio.ts).
       */
      html:not([data-mode]),
      html:not([data-mode]) body {
        background: #000;
      }

      /*
       * The studio screen's arrival (src/marche/ui/studio.ts adds `mst-go` to its layer; never
       * under reduced motion) — here, not in the boot chunk, whose byte budget has no room for
       * it: the logo falls from 4× and blurred onto its place (ease-in), lands squashed at
       * 0.28 s, rebounds and settles; from that impact the screen shakes and a burst of light
       * rays flares behind the logo (a white flash at its heart), spinning out. That impact is
       * studio.ts's `STUDIO_IMPACT_MS`, where the studio's sting puts its own (keep them equal).
       */
      .mst-go {
        animation: mst-sh 0.4s 0.28s;
      }

      .mst-go img {
        animation: mst-in 0.9s both;
      }

      .mst-go::before {
        content: '';
        position: absolute;
        z-index: -1;
        width: 95cqh;
        aspect-ratio: 1;
        background:
          radial-gradient(closest-side, #fffd, #fff6 18%, #fff0 42%),
          repeating-conic-gradient(#fff7 0 5deg, #0000 0 18deg);
        -webkit-mask: radial-gradient(closest-side, #000 15%, #0000);
        mask: radial-gradient(closest-side, #000 15%, #0000);
        opacity: 0;
        animation: mst-fl 1.3s 0.28s ease-out;
      }

      @keyframes mst-in {
        0% {
          transform: scale(4);
          filter: blur(12px);
          animation-timing-function: ease-in;
        }
        31% {
          transform: scale(1.25, 0.78);
          filter: drop-shadow(0 0 10px #fff);
        }
        50% {
          transform: scale(0.9, 1.1);
          filter: none;
        }
        68% {
          transform: scale(1.04, 0.97);
        }
        84% {
          transform: scale(0.99, 1.01);
        }
      }

      @keyframes mst-sh {
        25% {
          translate: -7px 5px;
        }
        50% {
          translate: 6px -4px;
        }
        75% {
          translate: -3px 2px;
        }
      }

      @keyframes mst-fl {
        0% {
          opacity: 1;
          scale: 0.45;
        }
        to {
          scale: 1.7;
          rotate: 25deg;
        }
      }

      html[data-mode='marche'] body,
      html[data-mode='ui'] body {
        background: #120e14;
        -webkit-touch-callout: none;
      }

      html[data-mode='marche'] #game-root,
      html[data-mode='ui'] #game-root {
        height: var(--scr-h);
      }

      /*
       * La Marche d'Erynd: one frame holds the canvas and the whole DOM UI. On a portrait
       * touch screen it is laid out landscape (viewport height × width) and turned a
       * quarter clockwise to fill the screen — no portrait guard (src/marche/ui/screen-turn.ts,
       * TURN_QUERY is the same media query). A size container: the UI's container units
       * and queries follow the frame, not the screen.
       */
      html[data-mode='marche'] #marche-frame,
      html[data-mode='gallery'] #marche-frame,
      html[data-mode='ui'] #marche-frame {
        position: fixed;
        left: 0;
        top: 0;
        width: var(--scr-w);
        height: var(--scr-h);
        container: marche-frame / size;
      }

      @media (orientation: portrait) and (pointer: coarse) {
        html[data-mode='marche'] #marche-frame,
        html[data-mode='gallery'] #marche-frame,
        html[data-mode='ui'] #marche-frame {
          width: var(--scr-h);
          height: var(--scr-w);
          transform-origin: 0 0;
          transform: translateX(var(--scr-w)) rotate(90deg);
        }

        html[data-mode='marche'] #game-root,
        html[data-mode='gallery'] #game-root,
        html[data-mode='ui'] #game-root {
          height: auto;
        }
      }

      /*
       * Orientation lock (screen-turn.ts, a setting, on by default): the script turns the frame
       * against the screen's own rotation (data-turn, clockwise degrees) so a tilted phone never
       * flips the game. Set only on touch screens in the modes above; it wins over the query.
       */
      html[data-turn='0'] #marche-frame,
      html[data-turn='180'] #marche-frame {
        width: var(--scr-w);
        height: var(--scr-h);
        transform: none;
      }

      html[data-turn='180'] #marche-frame {
        transform-origin: 50% 50%;
        transform: rotate(180deg);
      }

      html[data-turn='90'] #marche-frame,
      html[data-turn='270'] #marche-frame {
        width: var(--scr-h);
        height: var(--scr-w);
        transform-origin: 0 0;
        transform: translateX(var(--scr-w)) rotate(90deg);
      }

      html[data-turn='270'] #marche-frame {
        transform: translateY(var(--scr-h)) rotate(-90deg);
      }

      html[data-turn='0'] #game-root {
        height: var(--scr-h);
      }

      html[data-turn='90'] #game-root,
      html[data-turn='180'] #game-root,
      html[data-turn='270'] #game-root {
        height: auto;
      }

      /* Portrait guard: the legacy games are landscape-only (ADR-007). */
      #orientation-guard {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        background: #0b0d12;
        color: #e8eaf0;
        font-family: system-ui, sans-serif;
        z-index: 1000;
      }

      @media (orientation: portrait) {
        #orientation-guard {
          display: flex;
        }
      }

      /* La Marche turns instead (phones, tablets); narrow desktop windows play unturned. */
      html[data-mode='marche'] #orientation-guard,
      html[data-mode='gallery'] #orientation-guard,
      html[data-mode='ui'] #orientation-guard {
        display: none;
      }

      /*
       * The buttons' face (--font-btn): Lilita One (SIL OFL 1.1, assets/fonts/OFL.txt), subset to
       * Latin + French and renamed, as the OFL asks of a modified copy; fetched once a button
       * shows, embedded in the single-file preview (scripts/build-preview.mjs). 100 900: its one
       * heavy weight serves the buttons' 700, never a faux bold.
       */
      @font-face {
        font-family: 'Erynd Bouton';
        src: url('assets/fonts/erynd-bouton.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DM7ss7-u.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-DIUF0PZB.js">
  </head>
  <body>
    <div id="marche-frame"><div id="game-root"></div></div>
    <!-- Text is set from i18n at runtime (ADR-004: no hard-coded UI strings). -->
    <div id="orientation-guard" data-i18n="app:rotateDevice"></div>
  </body>
</html>
